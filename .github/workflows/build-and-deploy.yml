name: Build and Deploy

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - main-2

env:
    DOCKER_IMAGE: evgenys46/cibus-demo-api

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract commit SHA (short)
              id: vars
              run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./app
                  push: true
                  tags: |
                      ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}
                      ${{ env.DOCKER_IMAGE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update deployment manifest
              run: |
                  # Update image tag in deployment.yaml
                  sed -i "s|image:.*|image: ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}|g" k8s/deployment.yaml

                  # Show the change
                  git diff k8s/deployment.yaml

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  git add k8s/deployment.yaml
                  git commit -m "Update image to ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}" || echo "No changes to commit"
                  git push origin HEAD:${{ github.head_ref }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
