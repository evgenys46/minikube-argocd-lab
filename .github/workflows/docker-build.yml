name: Docker - Build and Update Deployment

on:
  push:
    branches:
      - main-2
    paths:
      - "app/**"
      - ".github/workflows/docker-build-deploy.yml"
  pull_request:
    branches:
      - main-2
    paths:
      - "app/**"
  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE: evgenys46/cibus-demo-api

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract commit SHA (short)
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment.yaml with new image
        run: |
          # Update the image tag in deployment.yaml
          sed -i "s|image: ${{ env.DOCKER_IMAGE }}:.*|image: ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}|g" k8s/deployment.yaml

          echo "Updated k8s/deployment.yaml"
          echo ""
          echo "New image tag:"
          grep "image:" k8s/deployment.yaml

      - name: Commit and push updated deployment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update image to ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}"
            git push
            echo "Deployment updated and pushed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Docker Image Built and Deployment Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Also tagged as:** \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** [Docker Hub](https://hub.docker.com/r/evgenys46/cibus-demo-api)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Deployment Update" >> $GITHUB_STEP_SUMMARY
          echo "- Updated \`k8s/deployment.yaml\` with new image tag" >> $GITHUB_STEP_SUMMARY
          echo "- Changes pushed to \`main-2\` branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Next Step" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will automatically detect the change in \`k8s/deployment.yaml\` and sync to Minikube" >> $GITHUB_STEP_SUMMARY
