name: Terraform - Generate Manifests

on:
  workflow_dispatch:

jobs:
  generate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve

      - name: Verify generated manifests
        run: |
          echo "Generated Kubernetes manifests:"
          ls -la k8s/
          echo ""
          echo "Files created:"
          for file in k8s/*.yaml; do
            echo "- $(basename $file)"
          done
          echo ""
          echo "Current image in deployment:"
          grep "image:" k8s/deployment.yaml

      - name: Commit and push manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "terraform: generate Kubernetes manifests"
            git push
            echo "Manifests pushed to repository"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Terraform Manifests Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated files in \`k8s/\` directory:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`namespace.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`deployment.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`service.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ingress.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tls-secret.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next:** Build Docker image and update deployment" >> $GITHUB_STEP_SUMMARY
